<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GCC Tracking | Administración General</title>

<style>

:root {
    --azul: #082744;
    --celeste: #087ff5;
    --verde: #16a34a;
    --naranja: #f59e0b;
    --rojo: #dc2626;
    --texto: #102c45;
    --gris: #64748b;
}

* {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #e6eef6;
    color: var(--texto);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
        linear-gradient(
            120deg,
            rgba(231,239,248,.85),
            rgba(231,239,248,.35)
        ),
        url('fondo_sprinter.jpg') center / cover no-repeat;
    filter: blur(4px);
    z-index: -1;
}

button, input, select {
    font: inherit;
}

button {
    cursor: pointer;
}

.layout {
    display: grid;
    grid-template-columns: 245px minmax(0, 1fr);
    min-height: 100vh;
}

.lateral {
    background: linear-gradient(160deg, #061d35, #103655);
    color: white;
    padding: 20px 12px;
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
}

.marca {
    text-align: center;
    padding: 10px 5px 25px;
    border-bottom: 1px solid #ffffff40;
}

.marca img {
    width: 190px;
    max-width: 100%;
}

.marca h3 {
    margin: 20px 0 0;
    font-size: 19px;
}

.menu {
    display: grid;
    gap: 7px;
    margin-top: 24px;
}

.menu button {
    display: flex;
    align-items: center;
    gap: 14px;
    border: none;
    background: transparent;
    color: #eef6ff;
    text-align: left;
    padding: 14px;
    border-radius: 9px;
    font-size: 15px;
}

.menu button:hover,
.menu button.activo {
    background: #087ff5;
}

.menu svg {
    width: 22px;
    height: 22px;
}

.salir {
    margin-top: auto;
    padding: 14px;
    border: 0;
    border-radius: 9px;
    background: #ffffff18;
    color: white;
    text-align: left;
}

.principal {
    min-width: 0;
}

.encabezado {
    min-height: 86px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 3px 20px #12345615;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

.encabezado h1 {
    font-size: 27px;
    margin: 0;
}

.encabezado p {
    margin: 5px 0 0;
    color: #496782;
    font-size: 14px;
}

.usuario {
    text-align: right;
    font-size: 14px;
    line-height: 1.6;
}

.fecha {
    font-size: 13px;
    color: var(--gris);
}

.contenido {
    padding: 24px;
}

.titulo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.titulo h2 {
    margin: 0;
    font-size: 24px;
}

.tarjetas {
    display: grid;
    grid-template-columns: repeat(5, minmax(130px, 1fr));
    gap: 16px;
}

.tarjeta,
.panel {
    background: rgba(255,255,255,.96);
    border-radius: 15px;
    border: 1px solid #e4ebf4;
    box-shadow: 0 8px 25px #12345618;
}

.tarjeta {
    padding: 20px;
    min-height: 145px;
}

.tarjeta .icono {
    color: var(--celeste);
    margin-bottom: 12px;
}

.tarjeta .icono svg {
    width: 29px;
    height: 29px;
}

.tarjeta h4 {
    margin: 0;
    font-size: 14px;
}

.tarjeta strong {
    display: block;
    font-size: clamp(21px, 2vw, 32px);
    margin-top: 9px;
    overflow-wrap: anywhere;
}

.tarjeta small {
    display: block;
    margin-top: 9px;
    color: var(--gris);
}

.paneles {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 18px;
    margin-top: 20px;
}

.panel {
    padding: 22px;
    min-width: 0;
}

.panel h3 {
    margin: 0 0 20px;
    font-size: 18px;
}

.fila-resumen {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 13px 0;
    border-bottom: 1px solid #e8eef5;
    font-size: 14px;
}

.barra {
    height: 13px;
    background: #e4edf7;
    border-radius: 10px;
    overflow: hidden;
    margin: 15px 0;
}

.barra span {
    height: 100%;
    display: block;
    background: linear-gradient(90deg, #087ff5, #25b5ef);
}

.circulo {
    width: 175px;
    height: 175px;
    border-radius: 50%;
    margin: 20px auto;
    display: grid;
    place-items: center;
}

.circulo-interior {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.circulo-interior strong {
    font-size: 32px;
}

.circulo-interior small {
    font-size: 13px;
    color: var(--gris);
}

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}

th, td {
    text-align: left;
    padding: 13px 12px;
    border-bottom: 1px solid #e6edf5;
    white-space: normal;
}

th {
    background: #edf4fa;
    color: #385b7a;
    font-size: 13px;
}

tbody tr:hover {
    background: #f3f8fd;
}

.estado {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 20px;
    background: #e1f6e8;
    color: #167a3d;
    font-size: 12px;
    font-weight: bold;
}

.estado.alerta {
    color: #a65a00;
    background: #fff0d6;
}

.estado.rojo {
    color: #b42323;
    background: #fde8e8;
}

.boton {
    border: 0;
    border-radius: 8px;
    padding: 12px 17px;
    background: var(--celeste);
    color: white;
    font-weight: bold;
}

.boton.secundario {
    background: #e8f1fa;
    color: var(--azul);
}

.boton:disabled {
    opacity: .5;
    cursor: wait;
}

.herramientas {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

input, select {
    border: 1px solid #ccd9e7;
    border-radius: 8px;
    padding: 12px;
    background: white;
    color: var(--texto);
}

.mensaje {
    padding: 14px;
    border-radius: 8px;
    background: #e7f2ff;
    color: #19558c;
    margin-bottom: 18px;
    font-size: 14px;
}

.mensaje.error {
    background: #fde8e8;
    color: #a51e24;
}

.login {
    width: calc(100% - 30px);
    max-width: 435px;
    margin: 9vh auto;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 60px #08274433;
}

.login-cabecera {
    background: var(--azul);
    padding: 30px;
    text-align: center;
    color: white;
}

.login-cabecera h2 {
    margin: 15px 0 10px;
}

.login-cabecera img {
    width: 210px;
    max-width: 100%;
}

.login-cuerpo {
    padding: 28px;
}

.login-cuerpo label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.login-cuerpo input {
    width: 100%;
    margin-bottom: 18px;
}

.login-cuerpo .boton {
    width: 100%;
}

.clave {
    display: flex;
    gap: 6px;
}

.clave button {
    height: 44px;
    border: 0;
    border-radius: 8px;
    background: #eaf1f8;
    color: var(--azul);
}

.pie-login {
    text-align: center;
    padding: 20px;
    color: var(--gris);
    border-top: 1px solid #edf1f6;
    font-size: 13px;
}

.vacio {
    padding: 22px;
    color: var(--gris);
    text-align: center;
}

@media (max-width: 1250px) {
    .tarjetas {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 850px) {
    .layout {
        grid-template-columns: 1fr;
    }

    .lateral {
        position: static;
        height: auto;
    }

    .marca {
        padding: 8px;
    }

    .marca img {
        width: 140px;
    }

    .menu {
        display: flex;
        overflow-x: auto;
        margin: 10px 0;
    }

    .menu button {
        white-space: nowrap;
    }

    .salir {
        margin: 8px 0;
    }

    .paneles {
        grid-template-columns: 1fr;
    }

    .tarjetas {
        grid-template-columns: repeat(2, 1fr);
    }

    .contenido {
        padding: 14px;
    }
}


.seg-dialog {
    border: 0;
    border-radius: 20px;
    padding: 28px;
    width: min(460px, 94vw);
    color: var(--texto);
    box-shadow: 0 20px 65px #08274444;
}
.seg-dialog::backdrop {
    background: #061d3599;
    backdrop-filter: blur(5px);
}
.seg-dialog h2 {
    margin-top: 0;
}
.seg-dialog label {
    display: block;
    font-weight: bold;
    font-size: 13px;
    margin: 16px 0 6px;
}
.seg-dialog input {
    width: 100%;
    min-width: 0;
}
.seg-dialog .clave {
    margin-bottom: 12px;
}
.seg-dialog .boton {
    width: 100%;
    margin-top: 10px;
}
#segMensaje {
    font-size: 14px;
    line-height: 1.5;
    margin: 15px 0;
    white-space: pre-wrap;
}

.vencimientos-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.vencimientos-cabecera h3 {
    margin: 0;
}

.vencimiento {
    display: inline-block;
    padding: 7px 10px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 12px;
    white-space: nowrap;
}

.vencimiento.vencido {
    background: #fee2e2;
    color: #b91c1c;
}

.vencimiento.urgente {
    background: #ffedd5;
    color: #c2410c;
}

.vencimiento.proximo {
    background: #fef3c7;
    color: #92400e;
}

.vencimiento.normal {
    background: #dcfce7;
    color: #166534;
}

.vencimiento.lejano {
    background: #e2e8f0;
    color: #475569;
}

.plegar-menu {
    border: 0;
    background: #ffffff12;
    color: white;
    border-radius: 9px;
    padding: 12px;
    margin-top: 16px;
    text-align: left;
    white-space: nowrap;
}

.plegar-menu:hover {
    background: #ffffff28;
}

.lateral {
    overflow-y: auto;
}

@media (min-width: 851px) {

    .layout.menu-plegado {
        grid-template-columns: 76px minmax(0, 1fr);
    }

    .menu-plegado .lateral {
        padding: 16px 8px;
    }

    .menu-plegado .marca h3,
    .menu-plegado .menu button span,
    .menu-plegado .plegar-menu span,
    .menu-plegado .salir span {
        display: none;
    }

    .menu-plegado .marca img {
        width: 54px;
    }

    .menu-plegado .menu button,
    .menu-plegado .plegar-menu,
    .menu-plegado .salir {
        justify-content: center;
        text-align: center;
        padding: 14px 8px;
    }

    .menu-plegado .menu svg {
        flex-shrink: 0;
    }
}

@media (max-width: 850px) {

    .plegar-menu {
        display: none;
    }
}

.audit-resumen {
    background: #edf4fa;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
}

.audit-resumen > strong {
    color: #082744;
    font-size: 19px;
}

.audit-resumen p {
    margin: 9px 0;
}

.audit-motivo {
    background: #fff7dc;
    border-left: 4px solid #eab308;
    border-radius: 7px;
    padding: 14px;
    margin: 18px 0;
    overflow-wrap: anywhere;
}

.audit-motivo p {
    margin-bottom: 0;
}

.audit-anterior {
    background: #fff1f2;
    color: #9f1239;
    overflow-wrap: anywhere;
}

.audit-nuevo {
    background: #ecfdf5;
    color: #166534;
    overflow-wrap: anywhere;
}

.audit-tecnico {
    margin-top: 20px;
    padding: 14px;
    border: 1px solid #dce6ef;
    border-radius: 9px;
}

.audit-tecnico summary {
    cursor: pointer;
    color: #496782;
    font-weight: bold;
}


.abm-accion.historial {
    background: #e6f0fc;
    color: #164b82;
    border: 1px solid #b9d3ee;
}

.historial-total {
    padding: 13px;

    border-radius: 8px;

    margin-bottom: 18px;
}

.historial-linea {

}

.historial-evento {

.historial-evento::before {

.historial-evento h4 {

    display: grid;

.comercial-tarjetas > div {

.comercial-proyeccion {

}

.comercial-proyeccion strong {

}

.comercial-personalizado,
.comercial-estandar {

.comercial-personalizado {

}

.comercial-estandar {

}


.enlace-suscripcion {
    background: transparent;
    border: 0;

    color: #0872d5;

}

.enlace-suscripcion:hover {

.enlace-suscripcion:disabled {

.recordar-sesion {

.recordar-sesion input[type="checkbox"] {

/* GCC V3 - INDICADOR DE OCUPACION */

.circulo-interior strong {
    font-size: 30px;
    color: #102c45;
}

.circulo-interior .ocupacion-cantidad {
    font-size: 15px;
    font-weight: bold;

    margin-top: 4px;
    text-align: center;
}



/* GCC V3 - TARJETAS INTERACTIVAS */

.tarjeta-interactiva {
    position: relative;
    cursor: pointer;
    transition: transform .18s ease,
                box-shadow .18s ease,
                outline-color .18s ease;
    outline: 2px solid transparent;
    outline-offset: -2px;
    -webkit-tap-highlight-color: transparent;
}

.tarjeta-flecha {
    position: absolute;
    top: 14px;
    right: 15px;
    font-size: 20px;
    font-weight: 600;
    color: var(--color-tarjeta);
    opacity: .65;
    transition: opacity .18s ease;
}

@media (hover: hover) {
    .tarjeta-interactiva:hover {
        transform: translateY(-4px);
        outline-color: var(--color-tarjeta);
        box-shadow: 0 10px 25px rgba(8,39,68,.16);
    }

    .tarjeta-interactiva:hover .tarjeta-flecha {
        opacity: 1;
    }
}

.tarjeta-interactiva:focus-visible {
    outline-color: var(--color-tarjeta);
}

.tarjeta-interactiva:active {
    transform: scale(.98);
}

@media (prefers-reduced-motion: reduce) {
    .tarjeta-interactiva {
        transition: none;
    }
}


/* GCC V3 - ESTILO INFORME DE ABONOS */

.abonos-cabecera {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.abonos-cabecera p {
    margin: 5px 0;
    color: #64748b;
    font-size: 13px;
}

.abonos-indicadores {
    display: grid;
    grid-template-columns: repeat(4,minmax(0,1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.abono-indicador {
    background: #f1f6fb;
    border: 1px solid #dbe6f0;
    border-radius: 12px;
    padding: 20px;
}

.abono-indicador small {
    display: block;
    color: #64748b;
    font-size: 12px;
    margin-bottom: 12px;
}

.abono-indicador strong {
    display: block;
    color: #082744;
    font-size: 27px;
    overflow-wrap: anywhere;
}

.abono-indicador.destacado {
    background: #eaf8ef;
    border-color: #b7e4c5;

    planes: '<path d="M2 7l10-5 10 5-10 5zM2 12l10 5 10-5M2 17l10 5 10-5"/>',

};

function icono(nombre) {

    return '<svg xmlns="http://www.w3.org/2000/svg" ' +
        'width="22" height="22" viewBox="0 0 24 24" ' +
        'fill="none" stroke="currentColor" ' +
        'stroke-width="1.8" stroke-linecap="round" ' +
        'stroke-linejoin="round">' +
        (iconos[nombre] || iconos.inicio) +
        '</svg>';

}

function escapar(valor) {

    return String(valor ?? "")
        .replace(/[&<>"']/g, c => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[c]);

}

function fecha(valor) {

    if (!valor) return "—";

    const texto = String(valor);

    const d = new Date(
        /^\d{4}-\d{2}-\d{2}$/.test(texto)
            ? texto + "T12:00:00"
            : texto
    );

    return Number.isNaN(d.getTime())
        ? "—"
        : d.toLocaleDateString("es-AR");

}

function dinero(valor, moneda = "ARS") {

    if (valor === null || valor === undefined) {
        return "—";
    }

    return new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: moneda,
        maximumFractionDigits: 0
    }).format(Number(valor));

}

function estado(valor) {

    let clase = "";

    if (
        ["suspendido","cancelado","inactivo","vencido",
         "cancelada","vencida","false"]
            .includes(String(valor))
    ) {
        clase = "rojo";
    }

    if (
        ["pendiente","mantenimiento"]
            .includes(String(valor))
    ) {
        clase = "alerta";
    }

    return '<span class="estado ' + clase + '">' +
        escapar(
            valor === true ? "Activo" :
            valor === false ? "Inactivo" :
            valor
        ) +
        '</span>';

}

function mensaje(texto, error = false) {

    $("mensajeGeneral").textContent = texto;
    $("mensajeGeneral").className =
        "mensaje" + (error ? " error" : "");

    $("mensajeGeneral").hidden = !texto;

}

async function consultar(tabla, columnas = "*") {

    const registros = [];
    const cantidad = 500;

    for (let inicio = 0; ; inicio += cantidad) {

        const {data, error} = await db
            .from(tabla)
            .select(columnas)
            .order("id", {ascending: true})
            .range(inicio, inicio + cantidad - 1);

        if (error) throw error;

        registros.push(...(data || []));

        if (!data || data.length < cantidad) break;
    }

    return registros;

}

async function rpc(nombre, parametros = {}) {

    const {data, error} = await db.rpc(
        nombre,
        parametros
    );

    if (error) throw error;

    return data;

}

        'style="--color-tarjeta:' + color + '">' +
        '<span class="tarjeta-flecha" aria-hidden="true">↗</span>' +
        '<div class="icono" style="color:' + color + '">' +
        icono(ico) +
        '</div>' +
        '<h4>' + escapar(nombre) + '</h4>' +
        '<strong>' + escapar(valor ?? "—") + '</strong>' +
        '<small>' + escapar(detalle) + '</small>' +
        '</article>';

}

function fila(nombre, valor) {

    return '<div class="fila-resumen">' +
        '<span>' + escapar(nombre) + '</span>' +
        '<strong>' + escapar(valor ?? "—") + '</strong>' +
        '</div>';

}

function tablaHTML(encabezados, filas) {

    if (!filas.length) {

        return '<div class="vacio">' +
            'No hay registros para mostrar.' +
            '</div>';

    }

    return '<div class="tabla-contenedor"><table>' +
        '<thead><tr>' +
        encabezados.map(
            e => '<th>' + escapar(e) + '</th>'
        ).join("") +
        '</tr></thead><tbody>' +
        filas.map(f =>
            '<tr>' +
            f.map(c => '<td>' + c + '</td>').join("") +
            '</tr>'
        ).join("") +
        '</tbody></table></div>';

}

async function dashboard() {

    const d = await rpc(
        "tracking_dashboard_superadmin"
    );

    const habilitados =
        Number(d.vehiculos_habilitados || 0);

    const autorizados =
        Number(d.vehiculos_autorizados || 0);

    const porcentaje = autorizados > 0
        ? Math.min(100, habilitados / autorizados * 100)
        : 0;

    const [suscripciones, empresas, auditoria] =
        await Promise.all([

            consultar("tracking_suscripciones"),

            consultar("tracking_empresas", "id,razon_social"),

            db.from("tracking_auditoria")
                .select("accion,entidad,fecha")
                .order("fecha", {ascending:false})
                .limit(6)

        ]);

    if (auditoria.error) throw auditoria.error;

    const nombres = Object.fromEntries(
        empresas.map(e => [e.id, e.razon_social])
    );

    const hoyArgentina = new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Argentina/Buenos_Aires",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(new Date());

    const partes = Object.fromEntries(
        hoyArgentina.map(p => [p.type, p.value])
    );

    const hoy = Date.UTC(
        Number(partes.year),
        Number(partes.month) - 1,
        Number(partes.day)
    );

    const diasRestantes = valor =>
        Math.round(
            (Date.parse(valor + "T00:00:00Z") - hoy) / 86400000
        );

    const vencimientos = suscripciones
        .filter(s =>
            ["activo", "vencido"].includes(s.estado) &&
            s.fecha_vencimiento &&
            diasRestantes(s.fecha_vencimiento) <= diasVencimientos
        )
        .map(s => ({
            ...s,
            dias: diasRestantes(s.fecha_vencimiento)
        }))
        .sort((a, b) => a.dias - b.dias);

    const porVencer = vencimientos.filter(s => s.dias >= 0).length;
    const vencidas = vencimientos.filter(s => s.dias < 0).length;

    function semaforoVencimiento(dias) {

        const clase =
            dias < 0 ? "vencido" :
            dias <= 7 ? "urgente" :
            dias <= 15 ? "proximo" :
            dias <= 30 ? "normal" : "lejano";

        const texto =
            dias < 0 ? `Vencida hace ${Math.abs(dias)} d` :
            dias === 0 ? "Vence hoy" :
            `${dias} días`;

        return `<span class="vencimiento ${clase}">${escapar(texto)}</span>`;
    }

    return `

        <div class="tarjetas">

            ${tarjeta(
                "Empresas",
                d.empresas_totales,
                "Empresas registradas",
                "empresas",
                "#087ff5"
            )}

            ${tarjeta(
                "Vehículos",
                habilitados,
                "Habilitados",
                "vehiculos",
                "#16a34a"
            )}

            ${tarjeta(
                "Usuarios",
                d.usuarios_administrativos,
                "Usuarios administrativos",
                "usuarios",
                "#087ff5"
            )}

            ${tarjeta(
                "Suscripciones",
                d.empresas_autorizadas,
                "Empresas autorizadas",
                "suscripciones",
                "#f59e0b"
            )}

            ${tarjeta(
                "Abonos mensuales",
                dinero(d.abonos_mensuales_ars),
                "Importe mensual proyectado",
                "dinero",
                "#16a34a"
            )}

        </div>

        <div class="paneles">

            <section class="panel">

                <h3>Resumen comercial</h3>

                ${fila("Empresas activas", d.empresas_activas)}

                ${fila("Empresas suspendidas", d.empresas_suspendidas)}

                ${fila("Vehículos autorizados", autorizados)}

                ${fila("Choferes activos", d.choferes_activos)}

                ${fila("Por vencer en " + diasVencimientos + " días", porVencer)}
                ${fila("Suscripciones vencidas", vencidas)}

            </section>

            <section class="panel">

                <h3>Ocupación de vehículos autorizados</h3>

                <div class="circulo"
                     style="background:conic-gradient(
                         #16a34a 0% ${porcentaje}%,
                         #e5edf5 ${porcentaje}% 100%
                     )">

                    <div class="circulo-interior">

                        <strong>${Number(autorizados) > 0
                            ? Math.round(Number(habilitados) / Number(autorizados) * 100) + "%"
                            : "—"}</strong>

                        <small class="ocupacion-cantidad">
                            ${habilitados} de ${autorizados}
                        </small>

                        <small class="ocupacion-etiqueta">
                            Vehículos habilitados
                        </small>

                    </div>

                </div>

                ${fila("Cupo autorizado", autorizados)}

                <div class="barra">

                    <span style="width:${porcentaje}%"></span>

                </div>

            </section>

            <section class="panel">

                <div class="vencimientos-cabecera">
                    <h3>Próximos vencimientos</h3>

                    <select id="rangoVencimientos"
                            aria-label="Período de vencimientos">

                        ${[15,30,60,90].map(d =>
                            `<option value="${d}" ${d === diasVencimientos ? "selected" : ""}>
                                ${d} días
                            </option>`
                        ).join("")}

                    </select>
                </div>

                ${tablaHTML(
                    ["Empresa","Vencimiento","Plazo","Abono mensual"],
                    vencimientos.map(s => [
                        `<button type="button"
                                 class="enlace-suscripcion"
                                 data-abrir-suscripcion="${escapar(s.id)}">
                            ${escapar(nombres[s.empresa_id] || "Empresa")}
                        </button>`,
                        escapar(fecha(s.fecha_vencimiento)),
                        semaforoVencimiento(s.dias),
                        escapar(dinero(s.importe_mensual, s.moneda))
                    ])
                )}

                <div class="vacio">
                    ${vencidas} vencidas · ${porVencer} próximas a vencer
                </div>

            </section>

            <section class="panel">

                <h3>Actividad reciente</h3>

                ${tablaHTML(
                    ["Acción","Entidad","Fecha"],
                    (auditoria.data || []).map(a => [
                        escapar(a.accion),
                        escapar(a.entidad),
                        escapar(fecha(a.fecha))
                    ])
                )}

            </section>

        </div>

    `;

}

async function contenidoSeccion(id) {

    let registros = [];
    let columnas = [];
    let filas = [];

    const empresas = [
        "suscripciones",
        "vehiculos",
        "usuarios",
        "auditoria"
    ].includes(id)

        ? await consultar(
            "tracking_empresas",
            "id,razon_social"
        )

        : [];

    const nombres = Object.fromEntries(
        empresas.map(e => [e.id, e.razon_social])
    );

    const nombreEmpresa = id =>
        escapar(nombres[id] || "—");

    switch (id) {

        case "empresas":

            registros = await consultar("tracking_empresas");

            columnas = [
                "Razón social",
                "Nombre comercial",
                "CUIT",
                "Correo",
                "Estado"
            ];

            filas = registros.map(r => [

                escapar(r.razon_social),

                escapar(r.nombre_comercial),

                escapar(r.cuit),

                escapar(r.email),

                estado(r.estado)

            ]);

            break;

        case "planes":

            registros = await consultar("tracking_planes");

            columnas = [
                "Plan",
                "Vehículos",
                "Usuarios administrativos",
                "Abono mensual",
                "Estado"
            ];

            filas = registros.map(r => [

                escapar(r.nombre),

                escapar(r.max_vehiculos),

                escapar(r.max_usuarios_administrativos),

                escapar(dinero(r.precio_mensual, r.moneda)),

                estado(r.activo)

            ]);

            break;

        case "suscripciones":

            registros = await consultar(
                "tracking_suscripciones"
            );

            const planes = await consultar(
                "tracking_planes",
                "id,nombre"
            );

            const nombresPlanes = Object.fromEntries(
                planes.map(p => [p.id, p.nombre])
            );

            columnas = [
                "Empresa",
                "Plan",
                "Vehículos",
                "Usuarios",
                "Abono",
                "Vencimiento",
                "Estado"
            ];

            filas = registros.map(r => [

                nombreEmpresa(r.empresa_id),

                escapar(nombresPlanes[r.plan_id] || "—"),

                escapar(r.max_vehiculos),

                escapar(r.max_usuarios_administrativos),

                escapar(dinero(r.importe_mensual, r.moneda)),

                escapar(fecha(r.fecha_vencimiento)),

                estado(r.estado)

            ]);

            break;

        case "vehiculos":

            registros = await consultar("tracking_vehiculos");

            columnas = [
                "Empresa",
                "Patente",
                "Vehículo",
                "Marca",
                "Modelo",
                "Estado"
            ];

            filas = registros.map(r => [

                nombreEmpresa(r.empresa_id),

                escapar(r.patente),

                escapar(r.nombre),

                escapar(r.marca),

                escapar(r.modelo),

                estado(r.estado)

            ]);

            break;

        case "usuarios":

            registros = await consultar("tracking_usuarios");

            columnas = [
                "Empresa",
                "Nombre",
                "Perfil",
                "Teléfono",
                "Estado"
            ];

            filas = registros.map(r => [

                nombreEmpresa(r.empresa_id),

                escapar(r.nombre),

                escapar(r.rol),

                escapar(r.telefono),

                estado(r.activo)

            ]);

            break;

        case "auditoria":

            const respuesta = await db
                .from("tracking_auditoria")
                .select("fecha,accion,entidad,empresa_id")
                .order("fecha", {ascending:false})
                .limit(300);

            if (respuesta.error) throw respuesta.error;

            registros = respuesta.data || [];

            columnas = [
                "Fecha y hora",
                "Empresa",
                "Operación",
                "Entidad"
            ];

            filas = registros.map(r => [

                escapar(
                    new Date(r.fecha).toLocaleString("es-AR")
                ),

                nombreEmpresa(r.empresa_id),

                escapar(r.accion),

                escapar(r.entidad)

            ]);

            break;

    }

    return `

        <section class="panel">

            <div class="herramientas">

                <input id="buscar"
                       type="search"
                       placeholder="Buscar registros...">

            </div>

            ${tablaHTML(columnas, filas)}

            <div class="vacio">

                ${registros.length} registros mostrados

                ${registros.length === 300
                    ? " · Límite inicial de consulta"
                    : ""}

            </div>

        </section>

    `;

}

async function verificarAcceso() {

    const {data, error} = await db.auth.getUser();

    if (error || !data.user) {

        mostrarLogin();

        return;

    }

    const autorizado = await rpc(
        "tracking_es_superadministrador"
    );

    if (autorizado !== true) {

        await db.auth.signOut({scope:"local"});

        mostrarLogin(
            "Tu cuenta no posee permisos de superadministrador."
        );

        return;

    }

    const {data:administrador} = await db
        .from("tracking_superadministradores")
        .select("nombre")
        .eq("user_id", data.user.id)
        .maybeSingle();

    $("nombreUsuario").textContent =
        administrador?.nombre || "Administración PymeCenter";

    $("fechaActual").textContent =
        new Date().toLocaleDateString("es-AR", {

            weekday: "long",

            month: "long",

            year: "numeric"

        });

    $("pantallaLogin").hidden = true;

    $("inicioCarga").hidden = true;

    $("layout").hidden = false;

    await navegar("inicio");

}

const claveSesion = "gcc_tracking_superadmin_web";

let recordarSesion = false;

try {

    const preferencia = localStorage.getItem("gcc_recordar_sesion");

    recordarSesion = preferencia === "1" ||
        (preferencia === null &&
         !!localStorage.getItem(claveSesion));

} catch {}

$("recordarSesion").checked = recordarSesion;

const almacenamientoSesion = {

    getItem(clave) {

        return recordarSesion
            ? localStorage.getItem(clave)
            : sessionStorage.getItem(clave);

    },

    setItem(clave, valor) {

        if (recordarSesion) {

            localStorage.setItem(clave, valor);
            sessionStorage.removeItem(clave);

        } else {

            sessionStorage.setItem(clave, valor);
            localStorage.removeItem(clave);

        }
    },

    removeItem(clave) {

        localStorage.removeItem(clave);
        sessionStorage.removeItem(clave);

    }

};

function guardarPreferenciaSesion() {

    const nuevaPreferencia = $("recordarSesion").checked;

    if (nuevaPreferencia !== recordarSesion) {

        almacenamientoSesion.removeItem(claveSesion);

    }

    recordarSesion = nuevaPreferencia;

    localStorage.setItem(
        "gcc_recordar_sesion",
        recordarSesion ? "1" : "0"
    );

}

async function iniciar() {

    try {

        const {createClient} = await import(

            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"

        );

        db = createClient(

            SUPABASE_URL,

            SUPABASE_KEY,

            {

                auth: {

                    storageKey: claveSesion,

                    storage: almacenamientoSesion,

                    persistSession: true,

                    autoRefreshToken: true,

                    detectSessionInUrl: false

                }

            }

        );

        seguridad = instalarSeguridad({
            db,
            supabaseUrl: SUPABASE_URL,
            supabaseKey: SUPABASE_KEY
        });

        abm = instalarABM({
    db,
    navegar,
    mensaje
});

await verificarAcceso();

    } catch (error) {

        mostrarLogin(
            "No se pudo conectar con GCC Tracking. " +
            "Verificá tu conexión e intentá nuevamente."
        );

    }

}

let segOcupado = false;

function campoClave(id, etiqueta, autocomplete) {

    return `<label for="${id}">${etiqueta}</label>
        <div class="clave">
            <input id="${id}" type="password"
                   autocomplete="${autocomplete}" required>
            <button type="button" data-ver="${id}">Mostrar</button>
        </div>`;
}

function segMensaje(texto, error = false) {
    $("segMensaje").textContent = texto;
    $("segMensaje").style.color = error ? "#b42323" : "#167a3d";
}

function mostrarDialogo(titulo, campos, boton, accion) {

    $("segTitulo").textContent = titulo;
    $("segCampos").innerHTML = campos;
    $("segAceptar").textContent = boton;
    segMensaje("");

    $("segCampos").querySelectorAll("[data-ver]").forEach(b => {
        b.onclick = () => {
            const input = $(b.dataset.ver);
            input.type = input.type === "password" ? "text" : "password";
            b.textContent = input.type === "password" ? "Mostrar" : "Ocultar";
        };
    });

    $("segForm").onsubmit = async e => {
        e.preventDefault();
        await ejecutarSeguridad(accion);
    };

    if (!$("segDialog").open) $("segDialog").showModal();
}

async function ejecutarSeguridad(accion) {

    if (segOcupado) return;

    segOcupado = true;
    $("segAceptar").disabled = true;
    $("segCancelar").disabled = true;
    segMensaje("");

    try {
        await accion();
    } catch (error) {
        segMensaje(error.message || "No se pudo completar la operación.", true);
    } finally {
        segOcupado = false;
        $("segAceptar").disabled = false;
        $("segCancelar").disabled = false;
    }
}

$("segCancelar").onclick = () => {
    if (!segOcupado) $("segDialog").close();
};

$("segDialog").addEventListener("cancel", e => {
    if (segOcupado) e.preventDefault();
});

$("segDialog").addEventListener("close", () => {
    $("segCampos").replaceChildren();
    segMensaje("");
});

$("btnRecuperar").onclick = () => {

    if (!seguridad || $("btnIngresar").disabled) return;

    mostrarDialogo(
        "Recuperar contraseña",
        `<p>Te enviaremos un código de ocho dígitos por correo.</p>
         <label for="segEmail">Correo electrónico</label>
         <input id="segEmail" type="email" autocomplete="email" required>`,
        "ENVIAR CÓDIGO",
        async () => {

            const email = $("segEmail").value.trim();
            const resultado = await seguridad.enviarCodigo(email);

            mostrarDialogo(
                "Restablecer contraseña",
                `<label for="segCodigo">Código de recuperación</label>
                 <input id="segCodigo" inputmode="numeric"
                        autocomplete="one-time-code"
                        pattern="[0-9]{8}" maxlength="8" required>
                 ${campoClave("segNueva", "Nueva contraseña", "new-password")}
                 ${campoClave("segConfirmar", "Confirmar contraseña", "new-password")}
                 <button id="segReenviar" type="button"
                         class="boton secundario">REENVIAR CÓDIGO</button>`,
                "RESTABLECER CONTRASEÑA",
                async () => {

                    const r = await seguridad.recuperarContrasena(
                        email,
                        $("segCodigo").value,
                        $("segNueva").value,
                        $("segConfirmar").value
                    );

                    $("segDialog").close();
                    $("email").value = email;
                    $("password").value = "";
                    $("mensajeLogin").className = "mensaje";
                    $("mensajeLogin").textContent = r.mensaje;
                    $("mensajeLogin").hidden = false;
                }
            );

            $("segReenviar").onclick = () =>
                ejecutarSeguridad(async () => {
                    const r = await seguridad.enviarCodigo(email);
                    segMensaje(r.mensaje);
                });

            segMensaje(resultado.mensaje);
        }
    );

    $("segEmail").value = $("email").value;
};

$("btnPerfil").onclick = async () => {

    if (!seguridad || segOcupado) return;

    $("btnPerfil").disabled = true;

    try {

        const {data, error} = await db.auth.getUser();

        if (error || !data.user) {
            throw new Error("No se pudo verificar la sesión.");
        }

        if ($("layout").hidden) return;

        mostrarDialogo(
            "Mi perfil",
            `<p id="segPerfilNombre"></p>
             <p id="segPerfilEmail"></p>
             <p>Superadministrador</p>
             <hr>
             ${campoClave("segActual", "Contraseña actual", "current-password")}
             ${campoClave("segNueva", "Nueva contraseña", "new-password")}
             ${campoClave("segConfirmar", "Confirmar contraseña", "new-password")}`,
            "CAMBIAR CONTRASEÑA",
            async () => {

                const r = await seguridad.cambiarContrasena(
                    $("segActual").value,
                    $("segNueva").value,
                    $("segConfirmar").value
                );

                $("segDialog").close();
                mensaje(r.mensaje);
            }
        );

        $("segPerfilNombre").textContent = $("nombreUsuario").textContent;
        $("segPerfilEmail").textContent = data.user.email || "";

    } catch (error) {

        mensaje(error.message, true);

    } finally {

        $("btnPerfil").disabled = false;

    }
};

iniciar();



// GCC V3 - ADAPTACION AUTOMATICA DE TABLAS

function adaptarFichasMoviles() {

    document.querySelectorAll(
        ".tabla-contenedor table"
    ).forEach(tabla => {

        const encabezados = Array.from(
            tabla.querySelectorAll("thead th")
        ).map(th => th.textContent.trim());

        if (!encabezados.length) return;

        const filas = Array.from(
            tabla.querySelectorAll("tbody tr")
        );

        if (!filas.length) return;

        if (filas.some(fila =>
            fila.cells.length !== encabezados.length ||
            Array.from(fila.cells).some(
                celda => celda.colSpan !== 1 ||
                         celda.rowSpan !== 1
            )
        )) return;

        tabla.classList.add("gcc-fichas");

        filas.forEach(fila => {

            Array.from(fila.cells).forEach(
                (celda, i) => {

                    celda.dataset.etiqueta =
                        encabezados[i] || "";

                    celda.classList.toggle(
                        "gcc-acciones-movil",
                        /^acci[oó]n(es)?$/i.test(
                            encabezados[i] || ""
                        )
                    );
                }
            );
        });
    });
}

let fichasPendientes = false;

const observadorFichas = new MutationObserver(() => {

    if (fichasPendientes) return;

    fichasPendientes = true;

    requestAnimationFrame(() => {
        fichasPendientes = false;
        adaptarFichasMoviles();
    });
});

observadorFichas.observe(document.body, {
    childList: true,
    subtree: true
});

adaptarFichasMoviles();

</script>
